<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Student Information</title>

    <script src="https://cdn.tailwindcss.com"></script>

</head>


<body class="bg-gradient-to-br from-blue-100 to-purple-100
             min-h-screen">


    <!-- Header -->
    <header class="bg-blue-600 text-white py-5 px-4">

        <h1 class="text-center
                   text-2xl sm:text-3xl md:text-4xl
                   font-bold">

            Student Information

        </h1>

    </header>


    <!-- Main -->
    <main class="flex items-center justify-center
                 min-h-[calc(100vh-80px)]
                 px-4 sm:px-6 py-8">


        <!-- Student Card -->
        <section class="bg-white
                        w-full
                        max-w-sm sm:max-w-md md:max-w-lg
                        rounded-2xl
                        shadow-xl
                        p-5 sm:p-8 md:p-10">


            <!-- Profile -->
            <div class="text-center">

                <div class="mx-auto
                            w-20 h-20
                            sm:w-24 sm:h-24
                            rounded-full
                            bg-blue-600
                            text-white
                            flex items-center justify-center
                            text-3xl sm:text-4xl
                            font-bold">

                    P

                </div>


                <h2 class="mt-4
                           text-xl sm:text-2xl md:text-3xl
                           font-bold text-gray-800">

                    Palak Ganesh Tajne

                </h2>

                <p class="text-gray-500 mt-1 text-sm sm:text-base">

                    Student Profile

                </p>

            </div>


            <!-- Information -->
            <div class="mt-8 space-y-4">

                <div class="border-b pb-3">

                    <p class="text-xs sm:text-sm text-gray-500">
                        Name
                    </p>

                    <p class="font-semibold text-sm sm:text-base">
                        Palak Ganesh Tajne
                    </p>

                </div>


                <div class="border-b pb-3">

                    <p class="text-xs sm:text-sm text-gray-500">
                        Course
                    </p>

                    <p class="font-semibold text-sm sm:text-base">
                        B.Tech Computer Science
                    </p>

                </div>


                <div class="border-b pb-3">

                    <p class="text-xs sm:text-sm text-gray-500">
                        Email
                    </p>

                    <a href="mailto:student@example.com"
                       class="text-blue-600
                              hover:underline
                              text-sm sm:text-base
                              break-all">

                        student@example.com

                    </a>

                </div>

            </div>


            <!-- Button -->
            <button onclick="showDetails()"
                class="w-full mt-7
                       bg-blue-600
                       hover:bg-blue-700
                       text-white
                       py-3
                       rounded-lg
                       text-sm sm:text-base
                       transition">

                View Message

            </button>


            <p id="message"
               class="text-center
                      mt-4
                      text-sm sm:text-base
                      font-semibold
                      text-green-600">
            </p>

        </section>

    </main>


    <script>

        function showDetails() {

            document.getElementById("message").innerText =
                "Student information displayed successfully!";

        }

    </script>

</body>

</html>
