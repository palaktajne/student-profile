<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Student Registration Portal</title>

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-gradient-to-br from-blue-50 to-indigo-100 min-h-screen">

    <!-- Header -->
    <header class="bg-indigo-700 text-white shadow-lg">
        <div class="max-w-6xl mx-auto px-6 py-5">
            <h1 class="text-2xl md:text-3xl font-bold">
                🎓 College Admission Portal
            </h1>

            <p class="text-indigo-200 mt-1">
                Student Registration Form
            </p>
        </div>
    </header>


    <!-- Main Section -->
    <main class="max-w-4xl mx-auto px-5 py-10">

        <div class="bg-white rounded-2xl shadow-xl p-6 md:p-10">

            <!-- Form Heading -->
            <div class="text-center mb-8">

                <h2 class="text-3xl font-bold text-gray-800">
                    Student Registration
                </h2>

                <p class="text-gray-500 mt-2">
                    Enter your details carefully to complete registration.
                </p>

            </div>


            <!-- Success Message -->
            <div id="successMessage"
                 class="hidden mb-6 p-4 bg-green-100 border border-green-400
                        text-green-700 rounded-lg text-center">

                ✅ Registration successful! Your form has been submitted.

            </div>


            <!-- Registration Form -->
            <form id="registrationForm" novalidate>


                <!-- Personal Information -->
                <h3 class="text-xl font-bold text-indigo-700 mb-5 border-b pb-2">
                    Personal Information
                </h3>


                <!-- Name -->
                <div class="mb-5">

                    <label class="block font-semibold mb-2">
                        Full Name *
                    </label>

                    <input
                        type="text"
                        id="name"
                        placeholder="Enter your full name"
                        class="w-full px-4 py-3 border rounded-lg
                               focus:ring-2 focus:ring-indigo-500 outline-none">

                    <p id="nameError" class="text-red-500 text-sm mt-1"></p>

                </div>


                <!-- Email -->
                <div class="mb-5">

                    <label class="block font-semibold mb-2">
                        Email Address *
                    </label>

                    <input
                        type="text"
                        id="email"
                        placeholder="example@gmail.com"
                        class="w-full px-4 py-3 border rounded-lg
                               focus:ring-2 focus:ring-indigo-500 outline-none">

                    <p id="emailError" class="text-red-500 text-sm mt-1"></p>

                </div>


                <!-- Mobile -->
                <div class="mb-5">

                    <label class="block font-semibold mb-2">
                        Mobile Number *
                    </label>

                    <input
                        type="text"
                        id="mobile"
                        placeholder="Enter 10-digit mobile number"
                        maxlength="10"
                        class="w-full px-4 py-3 border rounded-lg
                               focus:ring-2 focus:ring-indigo-500 outline-none">

                    <p id="mobileError" class="text-red-500 text-sm mt-1"></p>

                </div>


                <!-- Date of Birth -->
                <div class="mb-5">

                    <label class="block font-semibold mb-2">
                        Date of Birth *
                    </label>

                    <input
                        type="date"
                        id="dob"
                        class="w-full px-4 py-3 border rounded-lg
                               focus:ring-2 focus:ring-indigo-500 outline-none">

                    <p id="dobError" class="text-red-500 text-sm mt-1"></p>

                </div>


                <!-- Gender -->
                <div class="mb-6">

                    <label class="block font-semibold mb-3">
                        Gender *
                    </label>

                    <div class="flex gap-6">

                        <label class="flex items-center gap-2">
                            <input type="radio" name="gender" value="Male">
                            Male
                        </label>

                        <label class="flex items-center gap-2">
                            <input type="radio" name="gender" value="Female">
                            Female
                        </label>

                        <label class="flex items-center gap-2">
                            <input type="radio" name="gender" value="Other">
                            Other
                        </label>

                    </div>

                    <p id="genderError" class="text-red-500 text-sm mt-1"></p>

                </div>


                <!-- Academic Information -->
                <h3 class="text-xl font-bold text-indigo-700 mb-5 border-b pb-2">
                    Academic Information
                </h3>


                <!-- Course -->
                <div class="mb-5">

                    <label class="block font-semibold mb-2">
                        Select Course *
                    </label>

                    <select
                        id="course"
                        class="w-full px-4 py-3 border rounded-lg
                               focus:ring-2 focus:ring-indigo-500 outline-none">

                        <option value="">-- Select Course --</option>
                        <option value="CSE">Computer Science Engineering</option>
                        <option value="CSE-DS">CSE - Data Science</option>
                        <option value="IT">Information Technology</option>
                        <option value="ECE">Electronics & Communication</option>
                        <option value="ME">Mechanical Engineering</option>

                    </select>

                    <p id="courseError" class="text-red-500 text-sm mt-1"></p>

                </div>


                <!-- 12th Percentage -->
                <div class="mb-6">

                    <label class="block font-semibold mb-2">
                        12th Percentage *
                    </label>

                    <input
                        type="number"
                        id="percentage"
                        placeholder="Enter percentage"
                        min="0"
                        max="100"
                        class="w-full px-4 py-3 border rounded-lg
                               focus:ring-2 focus:ring-indigo-500 outline-none">

                    <p id="percentageError" class="text-red-500 text-sm mt-1"></p>

                </div>


                <!-- Account Information -->
                <h3 class="text-xl font-bold text-indigo-700 mb-5 border-b pb-2">
                    Account Information
                </h3>


                <!-- Password -->
                <div class="mb-5">

                    <label class="block font-semibold mb-2">
                        Password *
                    </label>

                    <input
                        type="password"
                        id="password"
                        placeholder="Minimum 8 characters"
                        class="w-full px-4 py-3 border rounded-lg
                               focus:ring-2 focus:ring-indigo-500 outline-none">

                    <p id="passwordError" class="text-red-500 text-sm mt-1"></p>

                </div>


                <!-- Confirm Password -->
                <div class="mb-6">

                    <label class="block font-semibold mb-2">
                        Confirm Password *
                    </label>

                    <input
                        type="password"
                        id="confirmPassword"
                        placeholder="Re-enter your password"
                        class="w-full px-4 py-3 border rounded-lg
                               focus:ring-2 focus:ring-indigo-500 outline-none">

                    <p id="confirmPasswordError"
                       class="text-red-500 text-sm mt-1"></p>

                </div>


                <!-- Terms -->
                <div class="mb-6">

                    <label class="flex items-start gap-3">

                        <input
                            type="checkbox"
                            id="terms"
                            class="mt-1 w-4 h-4">

                        <span class="text-sm text-gray-600">
                            I confirm that the information provided above
                            is correct.
                        </span>

                    </label>

                    <p id="termsError" class="text-red-500 text-sm mt-1"></p>

                </div>


                <!-- Buttons -->
                <div class="flex flex-col sm:flex-row gap-4">

                    <button
                        type="submit"
                        class="flex-1 bg-indigo-600 text-white py-3 rounded-lg
                               font-semibold hover:bg-indigo-700 transition">

                        Register Now

                    </button>

                    <button
                        type="reset"
                        id="resetBtn"
                        class="flex-1 bg-gray-200 text-gray-700 py-3 rounded-lg
                               font-semibold hover:bg-gray-300 transition">

                        Reset Form

                    </button>

                </div>

            </form>

        </div>

    </main>


    <!-- Footer -->
    <footer class="bg-gray-900 text-white text-center py-5">

        <p>
            © 2026 College Admission Portal
        </p>

    </footer>


    <!-- JavaScript -->
    <script>

        const form = document.getElementById("registrationForm");


        form.addEventListener("submit", function(event) {

            // Stop actual form submission
            event.preventDefault();


            // Get values
            const name = document.getElementById("name").value.trim();
            const email = document.getElementById("email").value.trim();
            const mobile = document.getElementById("mobile").value.trim();
            const dob = document.getElementById("dob").value;
            const course = document.getElementById("course").value;
            const percentage = document.getElementById("percentage").value;
            const password = document.getElementById("password").value;
            const confirmPassword =
                document.getElementById("confirmPassword").value;

            const gender =
                document.querySelector('input[name="gender"]:checked');

            const terms = document.getElementById("terms").checked;


            // Clear old errors
            document.querySelectorAll("p[id$='Error']")
                .forEach(function(error) {
                    error.innerText = "";
                });


            let valid = true;


            // Name validation
            if (name === "") {

                document.getElementById("nameError").innerText =
                    "Full name is required.";

                valid = false;
            }


            // Email validation
            const emailPattern =
                /^[^\s@]+@[^\s@]+\.[^\s@]+$/;

            if (email === "") {

                document.getElementById("emailError").innerText =
                    "Email is required.";

                valid = false;

            } else if (!emailPattern.test(email)) {

                document.getElementById("emailError").innerText =
                    "Please enter a valid email address.";

                valid = false;
            }


            // Mobile validation
            const mobilePattern = /^[0-9]{10}$/;

            if (mobile === "") {

                document.getElementById("mobileError").innerText =
                    "Mobile number is required.";

                valid = false;

            } else if (!mobilePattern.test(mobile)) {

                document.getElementById("mobileError").innerText =
                    "Mobile number must contain exactly 10 digits.";

                valid = false;
            }


            // Date validation
            if (dob === "") {

                document.getElementById("dobError").innerText =
                    "Date of birth is required.";

                valid = false;
            }


            // Gender validation
            if (!gender) {

                document.getElementById("genderError").innerText =
                    "Please select your gender.";

                valid = false;
            }


            // Course validation
            if (course === "") {

                document.getElementById("courseError").innerText =
                    "Please select a course.";

                valid = false;
            }


            // Percentage validation
            if (percentage === "") {

                document.getElementById("percentageError").innerText =
                    "Percentage is required.";

                valid = false;

            } else if (percentage < 0 || percentage > 100) {

                document.getElementById("percentageError").innerText =
                    "Percentage must be between 0 and 100.";

                valid = false;
            }


            // Password validation
            if (password === "") {

                document.getElementById("passwordError").innerText =
                    "Password is required.";

                valid = false;

            } else if (password.length < 8) {

                document.getElementById("passwordError").innerText =
                    "Password must contain at least 8 characters.";

                valid = false;
            }


            // Confirm password validation
            if (confirmPassword === "") {

                document.getElementById("confirmPasswordError").innerText =
                    "Please confirm your password.";

                valid = false;

            } else if (password !== confirmPassword) {

                document.getElementById("confirmPasswordError").innerText =
                    "Passwords do not match.";

                valid = false;
            }


            // Terms validation
            if (!terms) {

                document.getElementById("termsError").innerText =
                    "Please accept the confirmation.";

                valid = false;
            }


            // Final result
            if (valid) {

                document.getElementById("successMessage")
                    .classList.remove("hidden");

                // Scroll to success message
                document.getElementById("successMessage")
                    .scrollIntoView({
                        behavior: "smooth"
                    });

            } else {

                document.getElementById("successMessage")
                    .classList.add("hidden");

            }

        });


        // Reset form
        document.getElementById("resetBtn")
            .addEventListener("click", function() {

                document.getElementById("successMessage")
                    .classList.add("hidden");

                document.querySelectorAll("p[id$='Error']")
                    .forEach(function(error) {
                        error.innerText = "";
                    });

            });

    </script>

</body>
</html>
