
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <script src="https://cdn.tailwindcss.com"></script>

    <title>Student Cards</title>
</head>

<body class="bg-gray-100 p-6">

    <h1 class="text-3xl font-bold text-center mb-8">
        Student Details
    </h1>

    <!-- Student Cards -->
    <div id="studentContainer"
         class="grid grid-cols-1 md:grid-cols-2 gap-6 max-w-4xl mx-auto">

    </div>


    <!-- Student Details Section -->
    <div id="studentDetails"
         class="hidden max-w-md mx-auto mt-8 bg-white p-6 rounded-lg shadow-lg">

        <h2 class="text-2xl font-bold text-blue-600 mb-4">
            Student Information
        </h2>

        <p class="mb-2">
            <strong>Name:</strong>
            <span id="detailName"></span>
        </p>

        <p class="mb-2">
            <strong>Roll No:</strong>
            <span id="detailRoll"></span>
        </p>

        <p class="mb-2">
            <strong>Course:</strong>
            <span id="detailCourse"></span>
        </p>

        <button onclick="closeDetails()"
                class="mt-4 bg-red-500 text-white px-4 py-2 rounded hover:bg-red-700">
            Close
        </button>

    </div>


    <script>

        // Student data
        const students = [
            {
                name: "Aarchi Ramtekkar",
                roll: "CD25063",
                course: "CSE - Data Science"
            },

            {
                name: "Janhvi Bhoyar",
                roll: "CD25086",
                course: "CSE - Data Science"
            },

            {
                name: "Hitesh Nagpure",
                roll: "CD25085",
                course: "CSE - Data Science"
            },

            {
                name: "Niraj Dhanorkar",
                roll: "CD25103",
                course: "CSE - Data Science"
            }
        ];


        // Get container
        const container = document.getElementById("studentContainer");


        // Create student cards
        students.forEach((student, index) => {

            const card = document.createElement("div");

            card.className =
                "bg-white p-6 rounded-lg shadow-md border border-gray-200";

            card.innerHTML = `
                
                <h2 class="text-xl font-bold text-blue-600 mb-3">
                    ${student.name}
                </h2>

                <p class="text-gray-700 mb-1">
                    <strong>Roll No:</strong> ${student.roll}
                </p>

                <p class="text-gray-700 mb-4">
                    <strong>Course:</strong> ${student.course}
                </p>

                <button
                    onclick="viewStudent(${index})"
                    class="bg-blue-500 text-white px-5 py-2 rounded 
                           hover:bg-blue-700">
                    View Student
                </button>

            `;

            container.appendChild(card);
        });


        // View student function
        function viewStudent(index) {

            const student = students[index];

            document.getElementById("detailName").textContent =
                student.name;

            document.getElementById("detailRoll").textContent =
                student.roll;

            document.getElementById("detailCourse").textContent =
                student.course;

            // Show details
            document.getElementById("studentDetails")
                .classList.remove("hidden");
        }


        // Close details
        function closeDetails() {

            document.getElementById("studentDetails")
                .classList.add("hidden");
        }

    </script>

</body>
</html>
