<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Tailwind Heading</title>

    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-gray-100">

    <div class="min-h-screen flex items-center justify-center">

        <div class="text-center">

            <h1 id="heading"
                class="text-5xl font-bold text-center bg-purple-600 text-white px-8 py-6 rounded-lg">
                Welcome to Tailwind CSS
            </h1>

            <button onclick="changeHeading()"
                class="mt-6 bg-black text-white px-6 py-3 rounded hover:bg-gray-800">
                Change Heading
            </button>

        </div>

    </div>

    <script>
        function changeHeading() {
            document.getElementById("heading").innerText =
                "Tailwind CSS is Easy!";
        }
    </script>

</body>
</html>
