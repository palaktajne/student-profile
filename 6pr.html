<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Student Grade Calculator</title>

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-blue-50 min-h-screen">

    <!-- Header -->
    <header class="bg-blue-700 text-white text-center py-5 shadow-md">
        <h1 class="text-3xl font-bold">
            Student Grade Calculator
        </h1>

        <p class="text-blue-100 mt-1">
            Calculate total marks, percentage and grade
        </p>
    </header>


    <!-- Main Container -->
    <main class="max-w-3xl mx-auto px-5 py-10">

        <div class="bg-white rounded-2xl shadow-lg p-6 sm:p-8">

            <!-- Student Details -->
            <h2 class="text-2xl font-bold text-gray-800 mb-6">
                Student Details
            </h2>

            <div class="grid grid-cols-1 sm:grid-cols-2 gap-5 mb-8">

                <div>
                    <label class="block font-semibold mb-2">
                        Student Name
                    </label>

                    <input
                        type="text"
                        id="studentName"
                        placeholder="Enter student name"
                        class="w-full border border-gray-300 rounded-lg
                        px-4 py-3 focus:outline-none
                        focus:ring-2 focus:ring-blue-500">
                </div>

                <div>
                    <label class="block font-semibold mb-2">
                        Roll Number
                    </label>

                    <input
                        type="text"
                        id="rollNumber"
                        placeholder="Enter roll number"
                        class="w-full border border-gray-300 rounded-lg
                        px-4 py-3 focus:outline-none
                        focus:ring-2 focus:ring-blue-500">
                </div>

            </div>


            <!-- Marks -->
            <h2 class="text-2xl font-bold text-gray-800 mb-5">
                Enter Marks
            </h2>

            <div class="grid grid-cols-1 sm:grid-cols-2 gap-5">

                <!-- Subject 1 -->
                <div>
                    <label class="block font-semibold mb-2">
                        Mathematics
                    </label>

                    <input
                        type="number"
                        id="maths"
                        min="0"
                        max="100"
                        placeholder="Marks out of 100"
                        class="marks w-full border border-gray-300
                        rounded-lg px-4 py-3
                        focus:outline-none
                        focus:ring-2 focus:ring-blue-500">
                </div>


                <!-- Subject 2 -->
                <div>
                    <label class="block font-semibold mb-2">
                        Science
                    </label>

                    <input
                        type="number"
                        id="science"
                        min="0"
                        max="100"
                        placeholder="Marks out of 100"
                        class="marks w-full border border-gray-300
                        rounded-lg px-4 py-3
                        focus:outline-none
                        focus:ring-2 focus:ring-blue-500">
                </div>


                <!-- Subject 3 -->
                <div>
                    <label class="block font-semibold mb-2">
                        English
                    </label>

                    <input
                        type="number"
                        id="english"
                        min="0"
                        max="100"
                        placeholder="Marks out of 100"
                        class="marks w-full border border-gray-300
                        rounded-lg px-4 py-3
                        focus:outline-none
                        focus:ring-2 focus:ring-blue-500">
                </div>


                <!-- Subject 4 -->
                <div>
                    <label class="block font-semibold mb-2">
                        Computer Science
                    </label>

                    <input
                        type="number"
                        id="computer"
                        min="0"
                        max="100"
                        placeholder="Marks out of 100"
                        class="marks w-full border border-gray-300
                        rounded-lg px-4 py-3
                        focus:outline-none
                        focus:ring-2 focus:ring-blue-500">
                </div>


                <!-- Subject 5 -->
                <div class="sm:col-span-2">

                    <label class="block font-semibold mb-2">
                        Data Science
                    </label>

                    <input
                        type="number"
                        id="dataScience"
                        min="0"
                        max="100"
                        placeholder="Marks out of 100"
                        class="marks w-full border border-gray-300
                        rounded-lg px-4 py-3
                        focus:outline-none
                        focus:ring-2 focus:ring-blue-500">

                </div>

            </div>


            <!-- Calculate Button -->
            <button
                onclick="calculateResult()"
                class="w-full mt-8 bg-blue-600 text-white
                font-bold py-3 rounded-lg
                hover:bg-blue-700 transition">

                Calculate Result

            </button>


            <!-- Error Message -->
            <p id="errorMessage"
                class="text-red-600 text-center mt-4 hidden">
            </p>


            <!-- Result -->
            <div id="result"
                class="hidden mt-8">

                <h2 class="text-2xl font-bold text-center mb-6">
                    Result
                </h2>


                <!-- Student Information -->
                <div class="bg-blue-50 rounded-xl p-5 mb-5">

                    <div class="flex justify-between mb-2">
                        <span class="font-semibold">
                            Student Name:
                        </span>

                        <span id="resultName">
                        </span>
                    </div>

                    <div class="flex justify-between">
                        <span class="font-semibold">
                            Roll Number:
                        </span>

                        <span id="resultRoll">
                        </span>
                    </div>

                </div>


                <!-- Result Cards -->
                <div class="grid grid-cols-1 sm:grid-cols-3 gap-4">

                    <!-- Total -->
                    <div class="bg-gray-100 rounded-xl p-5 text-center">

                        <p class="text-gray-500">
                            Total Marks
                        </p>

                        <p id="total"
                            class="text-3xl font-bold text-blue-600 mt-2">
                            0
                        </p>

                        <p class="text-sm text-gray-500">
                            out of 500
                        </p>

                    </div>


                    <!-- Percentage -->
                    <div class="bg-gray-100 rounded-xl p-5 text-center">

                        <p class="text-gray-500">
                            Percentage
                        </p>

                        <p id="percentage"
                            class="text-3xl font-bold text-blue-600 mt-2">
                            0%
                        </p>

                    </div>


                    <!-- Grade -->
                    <div class="bg-gray-100 rounded-xl p-5 text-center">

                        <p class="text-gray-500">
                            Grade
                        </p>

                        <p id="grade"
                            class="text-3xl font-bold text-blue-600 mt-2">
                            -
                        </p>

                    </div>

                </div>


                <!-- Pass / Fail -->
                <div class="mt-5 text-center">

                    <p class="text-gray-500">
                        Result Status
                    </p>

                    <p id="status"
                        class="text-2xl font-bold mt-1">
                    </p>

                </div>


                <!-- Reset Button -->
                <button
                    onclick="resetCalculator()"
                    class="w-full mt-6 border border-blue-600
                    text-blue-600 font-semibold py-3 rounded-lg
                    hover:bg-blue-50">

                    Reset

                </button>

            </div>

        </div>

    </main>


    <!-- Footer -->
    <footer class="bg-gray-900 text-white text-center py-5">

        <p>
            Student Grade Calculator
        </p>

        <p class="text-gray-400 text-sm mt-1">
            Created using HTML, Tailwind CSS and JavaScript
        </p>

    </footer>


    <!-- JavaScript -->
    <script>

        function calculateResult() {

            // Get student details
            const name =
                document.getElementById("studentName").value.trim();

            const roll =
                document.getElementById("rollNumber").value.trim();


            // Get marks
            const maths =
                Number(document.getElementById("maths").value);

            const science =
                Number(document.getElementById("science").value);

            const english =
                Number(document.getElementById("english").value);

            const computer =
                Number(document.getElementById("computer").value);

            const dataScience =
                Number(document.getElementById("dataScience").value);


            // Error message
            const error =
                document.getElementById("errorMessage");


            // Check student details
            if (name === "" || roll === "") {

                error.innerText =
                    "Please enter student name and roll number.";

                error.classList.remove("hidden");

                return;
            }


            // Check marks
            const marks = [
                maths,
                science,
                english,
                computer,
                dataScience
            ];


            for (let mark of marks) {

                if (
                    mark < 0 ||
                    mark > 100 ||
                    isNaN(mark)
                ) {

                    error.innerText =
                        "Please enter marks between 0 and 100 for all subjects.";

                    error.classList.remove("hidden");

                    return;
                }

            }


            // Hide error
            error.classList.add("hidden");


            // Calculate total
            const total =
                maths +
                science +
                english +
                computer +
                dataScience;


            // Calculate percentage
            const percentage =
                (total / 500) * 100;


            // Calculate grade
            let grade;

            if (percentage >= 90) {

                grade = "A+";

            } else if (percentage >= 80) {

                grade = "A";

            } else if (percentage >= 70) {

                grade = "B";

            } else if (percentage >= 60) {

                grade = "C";

            } else if (percentage >= 50) {

                grade = "D";

            } else {

                grade = "F";

            }


            // Pass / Fail
            let status;

            if (percentage >= 40) {

                status = "PASS";

            } else {

                status = "FAIL";

            }


            // Display student details
            document.getElementById("resultName").innerText =
                name;

            document.getElementById("resultRoll").innerText =
                roll;


            // Display result
            document.getElementById("total").innerText =
                total;

            document.getElementById("percentage").innerText =
                percentage.toFixed(2) + "%";

            document.getElementById("grade").innerText =
                grade;

            document.getElementById("status").innerText =
                status;


            // Change status color
            const statusElement =
                document.getElementById("status");

            if (status === "PASS") {

                statusElement.className =
                    "text-2xl font-bold mt-1 text-green-600";

            } else {

                statusElement.className =
                    "text-2xl font-bold mt-1 text-red-600";

            }


            // Show result
            document.getElementById("result")
                .classList.remove("hidden");

        }


        // Reset calculator
        function resetCalculator() {

            document.getElementById("studentName").value = "";
            document.getElementById("rollNumber").value = "";

            document.getElementById("maths").value = "";
            document.getElementById("science").value = "";
            document.getElementById("english").value = "";
            document.getElementById("computer").value = "";
            document.getElementById("dataScience").value = "";

            document.getElementById("result")
                .classList.add("hidden");

            document.getElementById("errorMessage")
                .classList.add("hidden");

        }

    </script>

</body>
</html>
